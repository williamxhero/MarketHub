[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markethub-api"
version = "0.1.0"
description = "MarketHub HTTP API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "httpx>=0.28,<0.29",
    "pandas==2.3.3",
    "psycopg[binary]==3.3.3",
    "pyarrow==21.0.0",
    "quotemux @ git+https://github.com/williamxhero/QuoteMux.git@76c36932cb8fb95a60a6c18628f1205a217fddb6",
    "uvicorn[standard]==0.35.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data_threads", "main", "openapi_docs"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "routers*", "services*"]
